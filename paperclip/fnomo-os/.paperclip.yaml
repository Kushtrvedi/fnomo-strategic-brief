schema: "paperclip/v1"
company:
  attachmentMaxBytes: 10485760
agents:
  head-of-sales-pa:
    role: "head_of_sales_pa"
    icon: "target"
    capabilities: "Translates Kush's priorities into Fnomo execution tasks, enforces Tier A priority, and keeps the PA control loop tight."
    adapter:
      type: "codex_local"
      config:
        model: "gpt-5.3-codex"
        dangerouslyBypassApprovalsAndSandbox: true
    runtime:
      heartbeat:
        intervalSec: 300
    permissions:
      canCreateAgents: true
  outreach-agent:
    role: "outreach_agent"
    icon: "send"
    capabilities: "Generates problem-led Fnomo outreach that triggers wrong-decision recall before any product explanation."
    reportsTo: "head-of-sales-pa"
    adapter:
      type: "codex_local"
      config:
        model: "gpt-5.3-codex"
        dangerouslyBypassApprovalsAndSandbox: true
    runtime:
      heartbeat:
        intervalSec: 300
  follow-up-agent:
    role: "follow_up_agent"
    icon: "repeat"
    capabilities: "Reopens silent Fnomo conversations using new decision-risk angles and the 48h, 4d, 7d SLA."
    reportsTo: "head-of-sales-pa"
    adapter:
      type: "codex_local"
      config:
        model: "gpt-5.3-codex"
        dangerouslyBypassApprovalsAndSandbox: true
    runtime:
      heartbeat:
        intervalSec: 300
  reply-handler-agent:
    role: "reply_handler_agent"
    icon: "inbox"
    capabilities: "Classifies replies and creates the next response, stage movement, and action."
    reportsTo: "head-of-sales-pa"
    adapter:
      type: "codex_local"
      config:
        model: "gpt-5.3-codex"
        dangerouslyBypassApprovalsAndSandbox: true
    runtime:
      heartbeat:
        intervalSec: 300
  conversation-agent:
    role: "conversation_agent"
    icon: "messages-square"
    capabilities: "Runs structured decision-gap conversations before explaining Fnomo."
    reportsTo: "head-of-sales-pa"
    adapter:
      type: "codex_local"
      config:
        model: "gpt-5.3-codex"
        dangerouslyBypassApprovalsAndSandbox: true
    runtime:
      heartbeat:
        intervalSec: 300
  closing-agent:
    role: "closing_agent"
    icon: "badge-indian-rupee"
    capabilities: "Converts qualified Fnomo leads into the Rs 4,899 yearly Founder Circle path without discounting."
    reportsTo: "head-of-sales-pa"
    adapter:
      type: "codex_local"
      config:
        model: "gpt-5.3-codex"
        dangerouslyBypassApprovalsAndSandbox: true
    runtime:
      heartbeat:
        intervalSec: 300
  founder-activation-agent:
    role: "founder_activation_agent"
    icon: "sparkles"
    capabilities: "Turns founders into advocates through usage, realization, proof, and referral loops."
    reportsTo: "head-of-sales-pa"
    adapter:
      type: "codex_local"
      config:
        model: "gpt-5.3-codex"
        dangerouslyBypassApprovalsAndSandbox: true
    runtime:
      heartbeat:
        intervalSec: 300
  system-health-monitor:
    role: "system_health_monitor"
    icon: "activity"
    capabilities: "Monitors Paperclip task progression, pipeline movement, follow-up SLA, output quality, founder activation, and corrective action loops."
    reportsTo: "head-of-sales-pa"
    adapter:
      type: "codex_local"
      config:
        model: "gpt-5.3-codex"
        dangerouslyBypassApprovalsAndSandbox: true
    runtime:
      heartbeat:
        intervalSec: 300
  linkedin-agent:
    role: "linkedin_agent"
    icon: "linkedin"
    capabilities: "Runs LinkedIn profile triage, connection notes, DMs, follow-ups, comment-to-DM conversion, reply classification, and CRM writeback."
    reportsTo: "head-of-sales-pa"
    adapter:
      type: "codex_local"
      config:
        model: "gpt-5.3-codex"
        dangerouslyBypassApprovalsAndSandbox: true
        paperclipSkillSync:
          desiredSkills:
            - "fnomo-linkedin-agent"
            - "fnomo-outreach-engine"
            - "fnomo-reply-handler"
            - "fnomo-pipeline-operator"
            - "fnomo-execution-spine"
    runtime:
      heartbeat:
        intervalSec: 1800
  whatsapp-agent:
    role: "whatsapp_agent"
    icon: "message-circle"
    capabilities: "Runs WhatsApp manual-send packs, follow-ups, reply handling, seen/read signal tracking, contact hygiene, and CRM writeback."
    reportsTo: "head-of-sales-pa"
    adapter:
      type: "codex_local"
      config:
        model: "gpt-5.3-codex"
        dangerouslyBypassApprovalsAndSandbox: true
        paperclipSkillSync:
          desiredSkills:
            - "fnomo-whatsapp-agent"
            - "fnomo-outreach-engine"
            - "fnomo-reply-handler"
            - "fnomo-pipeline-operator"
            - "fnomo-execution-spine"
    runtime:
      heartbeat:
        intervalSec: 1800
  paperclip-operator:
    role: "paperclip_operator"
    icon: "workflow"
    capabilities: "Maintains Paperclip agents, issues, blockers, heartbeats, scheduled monitors, PA alerts, and source-of-truth discipline."
    reportsTo: "head-of-sales-pa"
    adapter:
      type: "codex_local"
      config:
        model: "gpt-5.3-codex"
        dangerouslyBypassApprovalsAndSandbox: true
        paperclipSkillSync:
          desiredSkills:
            - "fnomo-paperclip-operator"
            - "fnomo-executive-assistant"
            - "fnomo-pipeline-operator"
    runtime:
      heartbeat:
        intervalSec: 900
  live-signal-controller:
    role: "live_signal_controller"
    icon: "radar"
    capabilities: "Controls live execution windows, send progress, reply classification, CRM writeback checks, signal monitoring, and metrics publication."
    reportsTo: "head-of-sales-pa"
    adapter:
      type: "codex_local"
      config:
        model: "gpt-5.3-codex"
        dangerouslyBypassApprovalsAndSandbox: true
        paperclipSkillSync:
          desiredSkills:
            - "fnomo-live-signal-controller"
            - "fnomo-pipeline-operator"
            - "fnomo-reply-handler"
    runtime:
      heartbeat:
        intervalSec: 900
projects:
  fnomo-operating-system:
    color: "#0f766e"
    status: "in_progress"
sidebar:
  agents:
    - "head-of-sales-pa"
    - "outreach-agent"
    - "follow-up-agent"
    - "reply-handler-agent"
    - "conversation-agent"
    - "closing-agent"
    - "founder-activation-agent"
    - "system-health-monitor"
    - "linkedin-agent"
    - "whatsapp-agent"
    - "paperclip-operator"
    - "live-signal-controller"
  projects:
    - "fnomo-operating-system"
